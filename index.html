<script>
const $=id=>document.getElementById(id),PI=Math.PI,EXT=900,SPC=4,EN=30;
const SURF=['Asphalt','Dirt','Gravel'],SE=['🛣️','🟫','⚪'],SCOL=['#3b3e44','#8c6a43','#9a9684'],SRGB=[[.24,.25,.27],[.55,.42,.27],[.5,.48,.43]],EA=[.42,.4,.3];
const GR=[[1,.6,.5],[.8,1,.88],[.76,.9,1]],S0=[1,.9,.82],SEV=['OPEN','MEDIUM','TIGHT'],CC=['#22c55e','#facc15','#ef4444'];
let state='draw',night=false,tool='path',cur=null,raw=[],drawing=false,sel=0,brushUp=1,houseOn=1,bsz=34,bpos=null,tyre=0,stroke=null,LY={sc:1,cx:0,cz:0};
let N=0,Px,Pz,Tx,Tz,hh,hg,LF,UN,Wv,cum,corners=[],bl,br,CP=[],grp=null,cd=0,best=null,dpr=1;
const cv=$('d'),g2=cv.getContext('2d'),I={g:0,b:0,l:0,r:0,h:0};
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hs_=(i,j)=>{let h=Math.imul(i,374761393)+Math.imul(j,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
function vn(x,y){const i=Math.floor(x),j=Math.floor(y),u=x-i,v=y-j,s=u*u*(3-2*u),t=v*v*(3-2*v);return hs_(i,j)*(1-s)*(1-t)+hs_(i+1,j)*s*(1-t)+hs_(i,j+1)*(1-s)*t+hs_(i+1,j+1)*s*t}
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15,sm=(d,a,b)=>{const t=Math.max(0,Math.min(1,(d-a)/(b-a)));return t*t*(3-2*t)};
const fmt=t=>{const m=Math.floor(t/60);return m+':'+(t-m*60).toFixed(1).padStart(4,'0')},fd=t=>(t>=0?'+':'−')+Math.abs(t).toFixed(1);
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1800)}
// ---------- Stage drawing (open road) ----------
function rsmp(p,n){const c=[0];for(let i=1;i<p.length;i++)c[i]=c[i-1]+Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);const T=c[c.length-1],o=[];let j=0;
 for(let i=0;i<n;i++){const s=T*i/(n-1);while(j<p.length-2&&c[j+1]<s)j++;const t=(s-c[j])/((c[j+1]-c[j])||1);o.push({x:p[j].x+(p[j+1].x-p[j].x)*t,y:p[j].y+(p[j+1].y-p[j].y)*t})}return o}
function smooth(p,r,it){for(;it>0;it--)p=p.map((_,i)=>{if(!i||i==p.length-1)return p[i];let x=0,y=0,n=0;for(let q=-r;q<=r;q++){const a=p[i+q];if(a){x+=a.x;y+=a.y;n++}}return{x:x/n,y:y/n}});return p}
function make(r){let len=0;for(let i=1;i<r.length;i++)len+=Math.hypot(r[i].x-r[i-1].x,r[i].y-r[i-1].y);if(r.length<8||len<150)return null;
 let P=smooth(rsmp(r,260),3,2),x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
 const s=EXT/Math.max(x1-x0,y1-y0,60),mx=(x0+x1)/2,my=(y0+y1)/2;P=P.map(p=>({x:(p.x-mx)*s,y:(p.y-my)*s}));
 let T=0;for(let i=1;i<P.length;i++)T+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);
 const Q=smooth(rsmp(P,Math.max(100,Math.min(1600,Math.round(T/SPC)))),2,1),wo=Math.random()*100;let wc=0;
 return Q.map((p,i)=>{if(i)wc+=Math.hypot(p.x-Q[i-1].x,p.y-Q[i-1].y);const a=Q[Math.min(i+1,Q.length-1)],b=Q[Math.max(i-1,0)],dx=a.x-b.x,dy=a.y-b.y,l=Math.hypot(dx,dy)||1,w=(vn(wc/45+wo,wo*.37)-.5)*1.4;return{x:p.x-dy/l*w,y:p.y+dx/l*w}})}
function extend(P){const n=P.length,u=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}},d0=u(P[0],P[3]),d1=u(P[n-1],P[n-4]),pre=[],post=[];
 for(let i=EN;i>=1;i--)pre.push({x:P[0].x+d0.x*SPC*i,y:P[0].y+d0.y*SPC*i});for(let i=1;i<=EN;i++)post.push({x:P[n-1].x+d1.x*SPC*i,y:P[n-1].y+d1.y*SPC*i});return pre.concat(P,post)}
function randSurf(n,R){const a=new Uint8Array(n);for(let i=0;i<n;){const l=35+R()*140|0,q=R(),s=q<.4?0:q<.7?1:2;for(let j=0;j<l&&i<n;j++)a[i++]=s}return a}
function randH(n,R){const a=new Float32Array(n),p=[R()*6,R()*6,R()*6];for(let i=0;i<n;i++){const u=i/n*2*PI;a[i]=Math.max(0,Math.min(40,16+9*Math.sin(u*1.3+p[0])+5*Math.sin(u*3.1+p[1])+2*Math.sin(u*7+p[2])))}return a}
function randW(n,R){const a=new Float32Array(n),p=[R()*6,R()*6];for(let i=0;i<n;i++){const u=i/n*2*PI;a[i]=Math.max(2.4,Math.min(6.5,3.7+.8*Math.sin(u*4+p[0])+.5*Math.sin(u*9+p[1])))}return a}
function randHouses(n,R){const a=new Uint8Array(n);for(let c=0,m=4+(R()*5|0);c<m;c++){const s=EN+10+R()*(n-2*EN-80)|0,l=18+R()*34|0;for(let q=s;q<Math.min(n-EN-6,s+l);q++)a[q]=1}return a}
function rndName(){const A=['Dusty','Wild','Frozen','Misty','Rocky','Golden','Hidden','Lost','Windy','Silent','Crimson','Broken','Rolling','Savage','Sunny','Stormy'],B=['Ridge','Valley','Pass','Forest','Canyon','Coast','Summit','Hollow','Creek','Mesa','Hills','Gorge','Plateau','Marsh','Peak','Trail'];return A[Math.random()*A.length|0]+' '+B[Math.random()*B.length|0]}
function newTrack(P){const seed=Math.random()*1e9|0,R=rng(seed),Pe=extend(P),n=Pe.length;cur={name:rndName(),P:Pe,seed,s0:EN,f0:n-1-EN,surf:randSurf(n,R),hgt:randH(n,R),w:randW(n,R),hs:randHouses(n,R)};best=null}
function derive(){const P=cur.P;N=P.length;Px=P.map(p=>p.x);Pz=P.map(p=>p.y);cum=[0];for(let i=1;i<N;i++)cum[i]=cum[i-1]+Math.hypot(Px[i]-Px[i-1],Pz[i]-Pz[i-1]);
 Tx=[];Tz=[];for(let i=0;i<N;i++){const a=Math.max(0,i-1),b=Math.min(N-1,i+1),dx=Px[b]-Px[a],dz=Pz[b]-Pz[a],l=Math.hypot(dx,dz)||1;Tx.push(dx/l);Tz.push(dz/l)}
 const bx=(src,it,r)=>{let h=Float32Array.from(src);for(;it>0;it--)h=h.map((_,i)=>{let s=0,n=0;for(let q=-r;q<=r;q++){const k=i+q;if(k>=0&&k<N){s+=h[k];n++}}return s/n});return h};
 hh=bx(cur.hgt,4,4);Wv=bx(cur.w,2,3);rough();bridges();const S=cur.s0,F=cur.f0;CP=[S+((F-S)/3|0),S+((F-S)*2/3|0),F];
 const kap=new Float32Array(N),a=[];for(let i=0;i<N;i++)a[i]=Math.atan2(Tz[i],Tx[i]);
 for(let i=0;i<N-1;i++){let d=a[i+1]-a[i];d=Math.atan2(Math.sin(d),Math.cos(d));kap[i]=d/((cum[i+1]-cum[i])||1)}
 const ks=kap.map((_,i)=>{let s=0,n=0;for(let q=-3;q<=3;q++){if(i+q>=0&&i+q<N){s+=kap[i+q];n++}}return s/n});
 corners=[];for(let i=0;i<N-1;){if(Math.abs(ks[i])<1/120){i++;continue}const sg=Math.sign(ks[i]);let j=i,turn=0,mk=0;
  while(j<N-1&&Math.sign(ks[j])==sg&&Math.abs(ks[j])>1/170){turn+=ks[j]*(cum[j+1]-cum[j]);mk=Math.max(mk,Math.abs(ks[j]));j++}
  if(Math.abs(turn)>.4){const Rm=1/mk;corners.push({i0:i,i1:j,dir:sg,sev:Rm<30?2:Rm<65?1:0})}i=Math.max(j,i+1)}
 const R=rng(cur.seed+7);bl=new Uint8Array(N).fill(1);br=new Uint8Array(N).fill(1);
 for(let n=0,c=Math.max(2,N/55|0);n<c;n++){const s=R()*N|0,l=12+R()*30|0,ty=R()<.55?2:3,sd=R()<.5?bl:br;for(let q=s;q<Math.min(N-4,s+l);q++)if(q>EN+6&&q<N-EN-4)sd[q]=ty;if(R()<.5){const o=sd===bl?br:bl;for(let q=s;q<Math.min(N-4,s+l);q++)if(q>EN+6&&q<N-EN-4)o[q]=ty}}
 for(let k=0;k<N;k++)if(LF[k]>.3)bl[k]=br[k]=2;
 relay()}
function rough(){const sd=cur.seed%9973,pot=new Float32Array(N);let kf=Float32Array.from(cur.surf,v=>v?1:0);
 for(let it=0;it<2;it++)kf=kf.map((_,i)=>{let a=0,n=0;for(let q=-5;q<=5;q++){const k=i+q;if(k>=0&&k<N){a+=kf[k];n++}}return a/n});
